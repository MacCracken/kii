name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin stays the single source of
        # truth — no version is hardcoded in this YAML. Use the upstream
        # installer so the versioned ~/.cyrius/versions/<ver>/ layout matches
        # how cyrius resolves the pin. The previous hand-rolled flat copy into
        # ~/.cyrius/{bin,lib} left the pinned version unresolvable: it only
        # worked because a pre-6.5.25 bug in _dep_find_stdlib_dir() treated any
        # tree containing src/main.cyr as the cyrius repo and silently fell back
        # to the project's OWN ./lib. 6.5.25 fixed that, so from the v1.5.0 pin
        # (6.5.35) onward `cyrius deps` hard-errors under the flat layout with
        # "pins version X but it is not installed at ~/.cyrius/versions/X/lib".
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build
        # Binary name is `kii` per cyrius.cyml [build].output. See
        # ci.yml Build step for the rationale (repo name and binary
        # name diverge).
        run: |
          cyrius deps
          mkdir -p build
          cyrius build src/main.cyr build/kii

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*
